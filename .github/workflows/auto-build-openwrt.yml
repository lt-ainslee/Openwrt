name: Auto Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "OpenWrt source repository"
        required: true
        default: "https://github.com/openwrt/openwrt"
      source_branch:
        description: "OpenWrt source branch"
        required: true
        default: "openwrt-23.05"
      upload_release:
        description: "Publish firmware to GitHub Release"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "20 18 * * 5"
  push:
    branches:
      - main
    paths:
      - ".config"
      - "diy-part1.sh"
      - "diy-part2.sh"
      - "files/**"
      - "patches/**"
      - ".github/workflows/auto-build-openwrt.yml"

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto \
            xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Resolve source information
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SOURCE_REPO=${{ inputs.source_repo }}" >> "$GITHUB_ENV"
            echo "SOURCE_BRANCH=${{ inputs.source_branch }}" >> "$GITHUB_ENV"
            echo "UPLOAD_RELEASE=${{ inputs.upload_release }}" >> "$GITHUB_ENV"
          else
            echo "SOURCE_REPO=https://github.com/openwrt/openwrt" >> "$GITHUB_ENV"
            echo "SOURCE_BRANCH=openwrt-23.05" >> "$GITHUB_ENV"
            echo "UPLOAD_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Clone source code
        run: |
          git clone "$SOURCE_REPO" -b "$SOURCE_BRANCH" openwrt

      - name: Cache dl and ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            ~/.ccache
          key: ${{ runner.os }}-${{ env.SOURCE_BRANCH }}-${{ hashFiles('.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.SOURCE_BRANCH }}-

      - name: Load custom feeds
        run: |
          [ -f feeds.conf.default ] && cp -f feeds.conf.default openwrt/feeds.conf.default
          if [ -f diy-part1.sh ]; then
            chmod +x diy-part1.sh
            cd openwrt
            "$GITHUB_WORKSPACE/diy-part1.sh"
          fi

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -d files ] && cp -rf files openwrt/files
          if [ -d patches ]; then
            cp -rf patches openwrt/
            cd openwrt
            find patches -type f -name '*.patch' | sort | xargs -r -n 1 patch -p1 -i
            cd "$GITHUB_WORKSPACE"
          fi
          [ -f .config ] && cp -f .config openwrt/.config
          if [ -f diy-part2.sh ]; then
            chmod +x diy-part2.sh
            cd openwrt
            "$GITHUB_WORKSPACE/diy-part2.sh"
          fi

      - name: Download package
        run: |
          cd openwrt
          make defconfig
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV" || echo "DEVICE_NAME=" >> "$GITHUB_ENV"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      - name: Organize files
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE_DIR }}
          if-no-files-found: error

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true'
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        if: env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: ${{ env.FIRMWARE_DIR }}/*
